  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  // fully transparent parts are removed from rendering instead of painted at opacity 0
  const op = (node, v) => { node.style.opacity = v.toFixed(4); node.style.display = v < 0.002 ? 'none' : ''; };

  let vw, vh, cycle, touched = false;
  function layout() {
    vw = window.innerWidth; vh = window.innerHeight;
    stage.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    cycle = CYCLE_VH / 100 * vh;
    track.style.height = (cycle * CYCLES + vh) + 'px';
    if (window.scrollY < cycle * 0.5) window.scrollTo(0, cycle);   // start in the middle cycle
    render();
  }

  function frame(t) {
    const c0 = 0.5 * vw / LW;                         // logo = 50% of viewport width
    const ox = vw / 2 - LW / 2 * c0, oy = vh / 2 - LH / 2 * c0;
    // screen positions of the element centre: start (in logo), centre of screen, end (= sign centre)
    const S0 = [ox + DCX * c0, oy + DCY * c0];
    const C  = [vw / 2, vh / 2];
    const S1 = [ox + 300 * c0, oy + 300 * c0];

    const z = ease(smooth(0.0, 0.88, t));             // zoom progress, log scale
    const c = c0 * Math.pow(K, z);
    const a = ease(smooth(0.0, 0.45, t));             // element travels to centre
    const b = ease(smooth(0.55, 0.96, t));            // ...then to the sign position
    const px = lerp(lerp(S0[0], C[0], a), S1[0], b);
    const py = lerp(lerp(S0[1], C[1], a), S1[1], b);

    L0.setAttribute('transform', `translate(${px - DCX * c} ${py - DCY * c}) scale(${c})`);

    const outer = 1 - smooth(0.10, 0.40, t);
    op(el.s0, outer);
    op(el.t0, outer);
    op(el.s1, smooth(0.30, 0.56, t));
    op(el.d0, 1 - smooth(0.50, 0.64, t));
    const inner = smooth(0.62, 0.90, t);
    op(el.t1, inner);
    op(el.d1, inner);
  }

  function render() {
    let y = window.scrollY;
    // seamless wrap: first and last frame of a cycle are identical
    if (y < cycle * 0.5) { y += cycle; window.scrollTo(0, y); }
    else if (y > cycle * (CYCLES - 0.5)) { y -= cycle; window.scrollTo(0, y); }
    const t = ((y % cycle) + cycle) % cycle / cycle;
    frame(t);
    if (Math.abs(y - cycle) > 4) touched = true;
    hint.style.opacity = touched ? 0 : 1;
  }

  let queued = false;
  window.addEventListener('scroll', () => {
    if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; render(); });
  }, { passive: true });
  window.addEventListener('resize', layout);
  layout();
})();
</script>
</body>
</html>
