    const [R, G, B] = this.pal[p], b = 0.14 + 0.86 * Math.pow(lv / 7, 1.6);
    g.fillStyle = `rgb(${R * b | 0},${G * b | 0},${B * b | 0})`;
    g.font = `${lv === 7 ? 700 : 500} ${this.ch * K * 0.86}px "JetBrains Mono", ui-monospace, monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(dg ? '1' : '0', s.width / 2, s.height / 2 + s.height * 0.04);
    return (this.sprites[id] = s);
  }

  draw() {
    const cv = this.canvasRef.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height, K = this.k * this.dpr;
    const now = performance.now(), tilt = this.props.tilt ?? 0.5;
    let tx = this.mx, ty = this.my;
    if (now - this.lastMove > 4000) { const t = now / 1000; tx = Math.sin(t * 0.5) * 0.5; ty = Math.sin(t * 0.37) * 0.3; }
    const ss = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    const rect = this.scrollRef.current ? this.scrollRef.current.getBoundingClientRect() : null;
    const maxS = rect ? rect.height - innerHeight : 0;
    const pRaw = maxS > 0 ? Math.min(1, Math.max(0, -rect.top / maxS)) : 0;
    this.p += (pRaw - this.p) * 0.12;
    if (this.hintRef.current) {
      if (pRaw > 0.005) this.hintGone = true;
      this.hintO = (this.hintO ?? 1) + ((this.hintGone ? 0 : 1) - (this.hintO ?? 1)) * 0.08;
      const h = this.hintRef.current.style;
      h.opacity = this.hintO.toFixed(3);
      h.transform = `scale(${(0.85 + 0.15 * this.hintO).toFixed(3)})`;
    }
    const p = Math.min(1, this.p * 4), p2 = Math.min(1, Math.max(0, this.p * 4 - 1)), p3 = Math.min(1, Math.max(0, this.p * 4 - 2)), p4 = Math.max(0, this.p * 4 - 3), free = 1 - ss(0.35, 0.75, p), fade = ss(0.75, 0.92, p);
    this.yaw += (tx * tilt * 0.8 * free - this.yaw) * 0.06;
    this.pitch += (ty * tilt * 0.55 * free - this.pitch) * 0.06;
    if (free === 0) { this.yaw *= 0.8; this.pitch *= 0.8; }
    const cyw = Math.cos(this.yaw), syw = Math.sin(this.yaw), cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const size = Math.max(this.bw, this.bh);
    const frontZ = (Math.min(this.MAXL, Math.max(2, this.props.layers ?? 16)) - 1) * this.cw * (this.props.depth ?? 1) / 2;
    const D = Math.max(size * (this.props.perspective ?? 1.6), frontZ + size * 0.5), ox = W / 2, oy = H * 0.48;
    let sx, sy, sc;
    const proj = (x, y, z) => {
      const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw;
      const y1 = y * cp + z1 * sp, z2 = -y * sp + z1 * cp;
      sc = D / Math.max(D * 0.15, D - z2); sx = ox + x1 * sc * K; sy = oy + y1 * sc * K;
    };
    ctx.clearRect(0, 0, W, H);
    const p3w = Math.min(1, Math.max(0, this.p * 4 - 2)), wb = ss(0, 0.35, p3w);
    if (wb > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(0, Math.floor(H * (1 - wb)), W, Math.ceil(H * wb)); }
    const bb = ss(0.15, 0.6, Math.max(0, this.p * 4 - 3));
    if (bb > 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, Math.floor(H * (1 - bb)), W, Math.ceil(H * bb)); }

    const n = Math.ceil(this.digits.length * 0.0015);
    for (let i = 0; i < n; i++) this.digits[(Math.random() * this.digits.length) | 0] ^= 1;

    const c0 = this.props.cellSize ?? 11, c1 = this.props.cellSizeEnd ?? 9;
    const cs = Math.round(c0 + (c1 - c0) * ss(0, 0.75, p));
    if (cs !== this.curCell) { this.curCell = cs; this.build(); }
    const Lmax = Math.min(this.MAXL, Math.max(2, this.props.layers ?? 16));
    const L = Math.max(1, Math.round(Lmax + (1 - Lmax) * ss(0, 0.75, p)));
    const sp_ = this.cw * (this.props.depth ?? 1);
    const z0 = -(L - 1) * sp_ / 2;

    if (this.props.floor ?? true) {
      const fy = this.bh / 2 + this.ch * 5, st = this.cw * 3;
      for (let gz = -this.bw; gz <= this.bw; gz += st) for (let gx = -this.bw * 1.6; gx <= this.bw * 1.6; gx += st) {
        const fall = 1 - Math.hypot(gx / (this.bw * 1.6), gz / this.bw);
        if (fall <= 0) continue;
        proj(gx, fy, gz);
        ctx.fillStyle = `rgba(80,122,255,${(fall * 0.55).toFixed(3)})`;
        const r = 1.4 * this.dpr * sc;
        ctx.fillRect(sx - r / 2, sy - r / 2, r, r);
      }
    }

    const M = this.MAXL;
    if (fade > 0 && this.orig) {
      const ff = this.bw * K / this.ob.w * (1 - 0.1 * ss(0, 0.15, p2) + 0.1 * ss(0.85, 1, p2));
      const la = ss(0.15, 0.35, p2) * (1 - ss(0.75, 0.9, p2)), sa = fade * (1 - la);
      if (la > 0 && this.lk) {
        const g = 600 * ff / 692, w = 678 * g;
        const d = Math.max(0, Math.min(0.66 * w, (W * 0.94 - w) / 2)) * (ss(0.35, 0.55, p2) - ss(0.55, 0.75, p2));
        ctx.globalAlpha = la;
        ctx.drawImage(this.lk, ox - d - 355.7 * g, oy - 354.9 * g, 697 * g, 710 * g);
        ctx.drawImage(this.lm, ox + d - 355.7 * g, oy - 354.9 * g, 712 * g, 710 * g);
      }
      const left = this.ob.cx - this.ob.w / 2, t3 = ss(0.25, 0.8, p3);
      const s3 = W * 0.5 / ((1710 - left) * ff);
      const ffc = ff * (1 + (s3 - 1) * t3), ax = this.ob.cx + ((left + 1710) / 2 - this.ob.cx) * t3;
      const X0 = ox - ax * ffc, Y0 = oy - this.ob.cy * ffc;
      if (sa > 0) {
        ctx.globalAlpha = sa;
        ctx.drawImage(this.orig, X0, Y0, 600 * ffc, 600 * ffc);
      }
      const ta = ss(0.75, 0.95, p3);
      if (ta > 0 && this.ru) {
        ctx.globalAlpha = ta;
        ctx.drawImage(this.ru, X0, Y0, 1711 * ffc, 600 * ffc);
        const b4 = ss(0.15, 0.6, p4);
        if (b4 > 0 && this.ruW) {
          ctx.save(); ctx.beginPath(); ctx.rect(0, Math.floor(H * (1 - b4)), W, H); ctx.clip();
          ctx.drawImage(this.ruW, X0, Y0, 1711 * ffc, 600 * ffc);
          ctx.restore();
        }
      }
      const la4 = ss(0, 0.15, p4);
      if (la4 > 0 && this.sf) {
        const hs = 150 * ffc, m = Math.max(24 * this.dpr, Math.min(W, H) * 0.035);
        ctx.globalAlpha = la4;
        ctx.drawImage(this.sl, m, H - m - hs, hs, hs);
        ctx.drawImage(this.sf, W - m - hs, H - m - hs, hs, hs);
      }
    }
    ctx.globalAlpha = 1 - fade;
    if (fade < 1) for (let l = 0; l < L; l++) {
      const front = l === L - 1, list = this.cells;
      const lv = front ? 7 : Math.round(1 + 5 * (l / (L - 1)));
      const z = z0 + l * sp_;
      for (let j = 0; j < list.length; j++) {
        const e = list[j];
        proj(e.x, e.y, z);
        const s = this.sprite(this.hues[e.i * M + l], lv, this.digits[e.i * M + l]);
        const w = s.width * sc, h = s.height * sc;
        ctx.drawImage(s, sx - w / 2, sy - h / 2, w + 0.5, h + 0.5);
      }
    }
    ctx.globalAlpha = 1;
  }
}
